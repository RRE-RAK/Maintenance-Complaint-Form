NG","unit":"EXPSM063-904","type":"Apartment"},{"property":"312010063 EXPO BUILDING","unit":"EXPSM063-SHOP 1","type":"Shop"},{"property":"312010063 EXPO BUILDING","unit":"EXPSM063-SHOP 2","type":"Shop"},{"property":"312010063 EXPO BUILDING","unit":"EXPSM063-SHOP 3","type":"Shop"},{"property":"312010063 EXPO BUILDING","unit":"EXPSM063-SHOP 4","type":"Shop"}],"terms":{"Residential":[{"en":"Maintenance Coverage and Eligibility\nMaintenance service is provided for residential units only. For normal, non-emergency maintenance requests, our team will respond within 24–48 hours. The actual repair may take longer depending on the problem, availability of spare parts, access to the unit, or if an outside contractor is required. Non-emergency maintenance is available only to tenants with no overdue payments. The Leasing team will check the tenant’s account, and the Maintenance team will confirm whether the requested work is covered. Tenants with overdue payments may not receive non-emergency maintenance until the outstanding payment is settled. Emergency issues will be attended to regardless of outstanding payments.","ar":"نطاق خدمة الصيانة والأهلية\nتُقدم خدمات الصيانة للوحدات السكنية فقط. بالنسبة لطلبات الصيانة العادية وغير الطارئة، سيقوم فريقنا بالاستجابة خلال 24 إلى 48 ساعة. وقد يستغرق إتمام الإصلاح وقتاً أطول حسب طبيعة العطل، وتوفر قطع الغيار، وإمكانية الدخول إلى الوحدة، أو الحاجة إلى الاستعانة بمقاول خارجي. تتوفر خدمات الصيانة غير الطارئة فقط للمستأجرين الذين لا توجد عليهم مبالغ مستحقة ومتأخرة. يقوم فريق التأجير بالتحقق من حالة حساب المستأجر، ويقوم فريق الصيانة بالتأكد من أن العمل المطلوب مشمول ضمن خدمات الصيانة. في حال وجود مبالغ مستحقة ومتأخرة، قد لا يتم تقديم خدمات الصيانة غير الطارئة إلى حين سداد المبالغ المستحقة. أما الحالات الطارئة فسيتم التعامل معها بغض النظر عن وجود مبالغ مستحقة ومتأخرة."},{"en":"Emergency Maintenance\nEmergency maintenance is limited to major water leaks, electrical short circuits, serious property damage, interruption of essential services, or any condition that presents an immediate risk to health or safety. In case of an emergency, the building watchman should be contacted as the primary point of contact.","ar":"الصيانة الطارئة\nتقتصر الصيانة الطارئة على تسربات المياه الجسيمة، أو التماسات الكهربائية، أو الأضرار الجسيمة بالممتلكات، أو انقطاع الخدمات الأساسية، أو أي حالة تشكل خطراً مباشراً على الصحة أو السلامة. وفي حال وجود حالة طارئة، يجب التواصل مع حارس المبنى باعتباره جهة الاتصال الأولى."},{"en":"General Maintenance Responsibility\nThe Owner will provide maintenance only for items damaged due to normal wear and tear or the natural end of their lifespan. The Owner is not responsible for damage caused by misuse, negligence, or unapproved modifications by the Tenant.","ar":"مسؤولية الصيانة العامة\nيقتصر التزام المالك بأعمال الصيانة على العناصر التي تتعرض للتلف نتيجة الاستهلاك الطبيعي أو انتهاء عمرها الافتراضي. ولا يتحمل المالك مسؤولية الأضرار الناتجة عن سوء الاستخدام أو الإهمال أو أي تعديلات غير معتمدة يقوم بها المستأجر."},{"en":"Civil Works and Painting\nCivil works provided by the Owner are limited to basic structural repairs such as crack rectification, waterproofing, and closing existing partitions. Painting, ceiling, and decorative works are not included unless approved under management standards. Repainting of residential units will be considered every four (4) years only if the technical team confirms that the paint condition requires it.","ar":"الأعمال المدنية والدهان\nتقتصر الأعمال المدنية التي يقدمها المالك على الإصلاحات الإنشائية الأساسية مثل معالجة الشقوق والعزل المائي وإغلاق القواطع القائمة. ولا تشمل أعمال الدهان أو الأسقف أو الديكور إلا إذا تمت الموافقة عليها وفق معايير الإدارة. ويُنظر في إعادة دهان الوحدات السكنية كل أربع (4) سنوات فقط إذا أكد الفريق الفني أن حالة الدهان تستدعي ذلك."},{"en":"Plumbing\nPlumbing leaks will be rectified before the Tenant moves in. Any later plumbing issue caused by misuse, negligence, or Tenant modifications will be the Tenant’s responsibility.","ar":"السباكة\nسيتم إصلاح أي تسربات سباكة قبل استلام المستأجر للوحدة. وأي أعطال سباكة لاحقة ناتجة عن سوء الاستخدام أو الإهمال أو تعديلات المستأجر تكون على مسؤولية المستأجر."},{"en":"Electrical Supply and Lighting\nThe Owner will provide electrical supply up to the Main Distribution Board (Main DB). Additional electrical work must comply with management standards. The supply, installation, maintenance, repair, or replacement of lighting fixtures and lighting materials is not included in the standard maintenance service, except for new tenants during the first six (6) months of the tenancy where covered under the applicable warranty.","ar":"التغذية الكهربائية والإنارة\nيوفر المالك التغذية الكهربائية حتى لوحة التوزيع الرئيسية (Main DB)، ويجب أن تتوافق أي أعمال كهربائية إضافية مع معايير الإدارة. ولا تشمل خدمات الصيانة الاعتيادية توريد أو تركيب أو صيانة أو إصلاح أو استبدال وحدات ومواد الإنارة، باستثناء المستأجرين الجدد خلال الأشهر الستة (6) الأولى من فترة الإيجار إذا كانت مشمولة ضمن فترة الضمان المعمول بها."},{"en":"Air Conditioning\nAC maintenance is included only when the AC unit was originally provided by the Owner, unless the tenancy contract states otherwise. AC duct cleaning is not included in the standard maintenance service except in special cases, such as contamination or blockage caused by rodents, pigeons, or similar issues.","ar":"التكييف\nتشمل صيانة أجهزة التكييف فقط الأجهزة التي تم توفيرها أصلاً من قبل المالك، ما لم ينص عقد الإيجار على خلاف ذلك. ولا تشمل خدمات الصيانة الاعتيادية تنظيف مجاري التكييف، باستثناء الحالات الخاصة مثل وجود تلوث أو انسداد ناتج عن القوارض أو الحمام أو حالات مماثلة."},{"en":"Pest Control\nThe Owner will provide one full pest control service before or upon move-in. If a later pest issue is found to be caused by the Tenant’s behavior, hygiene, or misuse, the cost of the service will be charged to the Tenant.","ar":"مكافحة الآفات\nيوفر المالك خدمة مكافحة آفات واحدة كاملة قبل أو عند استلام الوحدة. وإذا تبين لاحقاً أن مشكلة الآفات ناتجة عن سلوك المستأجر أو مستوى النظافة أو سوء الاستخدام، فيتحمل المستأجر تكلفة الخدمة."},{"en":"Tenant Modifications and Safety Additions\nDecorative, structural, or safety-related additions made by the Tenant—including partitions, gypsum works, aluminium or wooden barriers, balcony nets, window protections, or similar works—are not part of the Owner’s maintenance responsibility. Any permitted work must comply with management requirements and must not block or affect access to mechanical or electrical services.","ar":"تعديلات المستأجر وإضافات السلامة\nلا تدخل التعديلات الديكورية أو الإنشائية أو إضافات السلامة التي ينفذها المستأجر، بما في ذلك القواطع وأعمال الجبس والحواجز المصنوعة من الألمنيوم أو الخشب وشبك الشرفات وحمايات النوافذ أو الأعمال المشابهة، ضمن مسؤوليات صيانة المالك. ويجب أن تتوافق أي أعمال مسموح بها مع متطلبات الإدارة وألا تعيق أو تؤثر على الوصول إلى الخدمات الميكانيكية أو الكهربائية."},{"en":"Fire-Fighting and Fire Alarm Systems\nResidential tenants are strictly prohibited from accessing, altering, tampering with, or carrying out any work on the building’s fire-fighting or fire alarm systems.","ar":"أنظمة مكافحة الحريق وإنذار الحريق\nيُمنع منعاً باتاً على المستأجرين السكنيين الوصول إلى أنظمة مكافحة الحريق أو أنظمة إنذار الحريق في المبنى أو تعديلها أو العبث بها أو تنفيذ أي أعمال عليها."},{"en":"Move-Out and Restoration\nAny modification, installation, or fit-out carried out by the Tenant must be removed upon move-out, and the unit must be restored to its original condition. The cost of restoration may be deducted from the security deposit in accordance with the tenancy contract.","ar":"الإخلاء وإعادة الوحدة إلى حالتها الأصلية\nيجب على المستأجر عند إخلاء الوحدة إزالة أي تعديلات أو تركيبات أو أعمال تجهيز قام بها، وإعادة الوحدة إلى حالتها الأصلية. ويجوز خصم تكاليف إعادة الوحدة إلى حالتها الأصلية من مبلغ التأمين وفقاً لأحكام عقد الإيجار."}],"Commercial":[{"en":"Commercial Maintenance Scope\nExcept as expressly stated below, maintenance services are not included for commercial units. Air-conditioning (AC) maintenance may be provided only in accordance with the Owner’s approved procedures, established maintenance standards, and the conditions stated under Air Conditioning below.","ar":"نطاق الصيانة للوحدات التجارية\nباستثناء ما هو منصوص عليه صراحةً أدناه، لا تشمل خدمات الصيانة الوحدات التجارية. ويجوز تقديم صيانة أجهزة التكييف فقط وفقاً للإجراءات المعتمدة من المالك ومعايير الصيانة المعمول بها والشروط الواردة أدناه تحت بند التكييف."},{"en":"Electrical Supply and Lighting\nThe Owner will provide electrical supply up to the Main Distribution Board (Main DB). Additional electrical work must comply with management standards. The supply, installation, maintenance, repair, or replacement of lighting fixtures and lighting materials is not included in the standard maintenance service, except for new tenants during the first six (6) months of the tenancy where covered under the applicable warranty.","ar":"التغذية الكهربائية والإنارة\nيوفر المالك التغذية الكهربائية حتى لوحة التوزيع الرئيسية (Main DB)، ويجب أن تتوافق أي أعمال كهربائية إضافية مع معايير الإدارة. ولا تشمل خدمات الصيانة الاعتيادية توريد أو تركيب أو صيانة أو إصلاح أو استبدال وحدات ومواد الإنارة، باستثناء المستأجرين الجدد خلال الأشهر الستة (6) الأولى من فترة الإيجار إذا كانت مشمولة ضمن فترة الضمان المعمول بها."},{"en":"Plumbing\nPlumbing leaks will be rectified before the Tenant moves in. Any later plumbing issues will be the Tenant’s responsibility.","ar":"السباكة\nسيتم إصلاح أي تسربات سباكة قبل استلام المستأجر للوحدة، وأي أعطال سباكة لاحقة تكون على مسؤولية المستأجر."},{"en":"Fire-Fighting and Fire Alarm Systems\nAny modification to the fire-fighting or fire alarm system requires prior approval. If the Tenant installs a separate Fire Alarm Control Panel (FACP), all related interfacing or installation work will be the Tenant’s responsibility.","ar":"أنظمة مكافحة الحريق وإنذار الحريق\nيتطلب أي تعديل على أنظمة مكافحة الحريق أو إنذار الحريق الحصول على موافقة مسبقة. وفي حال قيام المستأجر بتركيب لوحة تحكم إنذار حريق مستقلة (FACP)، فإن جميع أعمال الربط أو التركيب المرتبطة بها تكون على مسؤولية المستأجر."},{"en":"Tenant Modifications, Fit-Out and Restoration\nAny modification, installation, or fit-out carried out by the Tenant must be removed upon move-out, and the unit must be restored to its original condition. Restoration costs may be deducted from the security deposit in accordance with the tenancy contract.","ar":"تعديلات المستأجر وأعمال التجهيز وإعادة الوحدة إلى حالتها الأصلية\nيجب إزالة أي تعديلات أو تركيبات أو أعمال تجهيز قام بها المستأجر عند إخلاء الوحدة، وإعادة الوحدة إلى حالتها الأصلية. ويجوز خصم تكاليف إعادة الوحدة إلى حالتها الأصلية من مبلغ التأمين وفقاً لأحكام عقد الإيجار."},{"en":"Air Conditioning\nAC maintenance is included only if the AC unit was originally provided by the Owner, unless the tenancy contract states otherwise. If the tenancy contract states that AC maintenance is not provided, AC maintenance will be the Tenant’s responsibility.","ar":"التكييف\nتشمل صيانة أجهزة التكييف فقط الأجهزة التي تم توفيرها أصلاً من قبل المالك، ما لم ينص عقد الإيجار على خلاف ذلك. وإذا نص عقد الإيجار على عدم شمول صيانة التكييف، فتكون صيانة التكييف على مسؤولية المستأجر."},{"en":"AC Duct Cleaning\nAC duct cleaning is not included in the maintenance scope except in special cases such as rodent issues or excessive dust accumulation.","ar":"تنظيف مجاري التكييف\nلا تشمل أعمال الصيانة تنظيف مجاري التكييف إلا في حالات خاصة مثل وجود قوارض أو تراكم مفرط للأتربة."},{"en":"Commercial Compliance Documents\nThe Tenant of a commercial unit shall provide a valid Trade License and Civil Defense Certificate (CDC) annually and upon request. Failure to comply shall entitle the Owner to immediately terminate the tenancy contract without prior notice and charge the Tenant an amount equivalent to two (2) months’ rent based on the total contract value.","ar":"مستندات الامتثال للوحدات التجارية\nيلتزم مستأجر الوحدة التجارية بتقديم رخصة تجارية سارية المفعول وشهادة الدفاع المدني (CDC) سنوياً وعند الطلب. وفي حال عدم الالتزام، يحق للمالك إنهاء عقد الإيجار فوراً دون إشعار مسبق، مع تحميل المستأجر مبلغاً يعادل إيجار شهرين (2) استناداً إلى إجمالي قيمة العقد."},{"en":"Commercial Security Deposit\nFor shops, showrooms, and other commercial units, the security deposit amount will be determined based on the size, type, condition, and use of the unit and will be stated in the Tenant’s contract.","ar":"مبلغ التأمين للوحدات التجارية\nبالنسبة للمحلات والمعارض وغيرها من الوحدات التجارية، يتم تحديد مبلغ التأمين بناءً على مساحة الوحدة ونوعها وحالتها وطبيعة استخدامها، ويتم توضيح المبلغ في عقد المستأجر."}]},"t":{"en":{"title":"Maintenance Service Request","sub":"Report an issue in three simple steps.","step1":"1. Tenant & Property Details","step2":"2. Maintenance Issue","step3":"3. Review & Submit","property":"Property / Building","unit":"Unit Number","name":"Tenant Name","phone":"UAE Mobile Number","email":"Email (optional)","category":"Issue Type","problem":"Specific Problem","desc":"Describe the issue","priority":"Urgency","normal":"Normal","urgent":"Urgent / Safety Concern","photos":"Attach photos (up to 3, each under 3 MB)","next":"Continue","back":"Back","send":"Submit Complaint","terms":"Applicable Maintenance Terms","agree":"I acknowledge the maintenance terms and agree to the processing of my information for this complaint.","review":"Review your information","note":"Submitting a request does not guarantee free maintenance. Eligibility is subject to review and tenancy terms.","emergency":"For serious water leaks, electrical short circuits or immediate safety hazards, contact the building watchman immediately. Do not rely only on this form.","success":"Your complaint was submitted. Reference:","fail":"Submission failed. Please try again or contact the building team.","choose":"Select","noUnit":"Please select your unit."},"ar":{"title":"طلب خدمة الصيانة","sub":"بلّغ عن مشكلة الصيانة في ثلاث خطوات بسيطة.","step1":"١. بيانات المستأجر والعقار","step2":"٢. تفاصيل مشكلة الصيانة","step3":"٣. المراجعة والإرسال","property":"العقار / المبنى","unit":"رقم الوحدة","name":"اسم المستأجر","phone":"رقم الهاتف المتحرك الإماراتي","email":"البريد الإلكتروني (اختياري)","category":"نوع المشكلة","problem":"تفاصيل العطل","desc":"يرجى وصف المشكلة","priority":"درجة الاستعجال","normal":"عادي","urgent":"عاجل / خطر على السلامة","photos":"إرفاق صور (بحد أقصى ٣ صور، أقل من ٣ ميغابايت للصورة)","next":"متابعة","back":"رجوع","send":"إرسال الشكوى","terms":"شروط الصيانة المعمول بها","agree":"أقر بالاطلاع على شروط الصيانة وأوافق على معالجة بياناتي لغرض متابعة هذه الشكوى.","review":"مراجعة البيانات","note":"تقديم الطلب لا يعني ضمان الصيانة المجانية. تخضع الأهلية للمراجعة وشروط عقد الإيجار.","emergency":"في حالات تسرب المياه الشديد أو التماس الكهربائي أو الخطر المباشر على السلامة، يرجى التواصل فوراً مع حارس المبنى وعدم الاكتفاء بهذا النموذج.","success":"تم إرسال الشكوى. الرقم المرجعي:","fail":"تعذر إرسال الطلب. يرجى المحاولة مرة أخرى أو التواصل مع إدارة المبنى.","choose":"اختر","noUnit":"يرجى اختيار الوحدة."}},"cats":[["Air Conditioning","التكييف",[["Not cooling","لا يبرد"],["Water leakage","تسرب مياه"],["Not working","لا يعمل"],["Noise","صوت غير طبيعي"]]],["Plumbing","السباكة",[["Water leak","تسرب مياه"],["Blocked drain","انسداد الصرف"],["Toilet / sanitary fixture","المرحاض / الأدوات الصحية"],["Low water pressure","ضعف ضغط المياه"]]],["Electrical","الكهرباء",[["No power","انقطاع الكهرباء"],["Circuit tripping","فصل القاطع الكهربائي"],["Socket / switch","مقبس / مفتاح كهربائي"],["Lighting","الإنارة"]]],["Doors and Windows","الأبواب والنوافذ",[["Door / lock","باب / قفل"],["Window","نافذة"]]],["Walls and Ceilings","الجدران والأسقف",[["Cracks","تشققات"],["Water seepage","تسرب المياه"],["Other civil works","أعمال مدنية أخرى"]]],["Water Supply and Drainage","المياه والصرف الصحي",[["No water","انقطاع المياه"],["Drainage","الصرف الصحي"]]],["Common Areas","المناطق المشتركة",[["Corridor / stairs","الممرات / السلالم"],["Shared facilities","المرافق المشتركة"]]],["Other","أخرى",[["Other issue","مشكلة أخرى"]]]]};

  const API_URL = 'https://script.google.com/macros/s/AKfycbyGD744_dQGa5ZCsSEisJ4SgAJ8OfWvBazzGePVbZK8eq0kymuIJCdghRhXHPxzHEpV/exec';
  // ===== END WEB APP URL =====

  let lang='en',step=0,files=[];const $=id=>document.getElementById(id),text=(en,ar)=>lang==='en'?en:ar;function render(){document.documentElement.lang=lang;document.body.classList.toggle('rtl',lang==='ar');$('lang').textContent=lang==='en'?'العربية':'English';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=DATA.t[lang][e.dataset.i]);let old=$('unit').value;setupUnitSearch();$('unit').value=old;old=$('category').value;$('category').innerHTML='<option value="">'+DATA.t[lang].choose+'</option>'+DATA.cats.map(c=>'<option value="'+c[0]+'">'+text(c[0],c[1])+'</option>').join('');$('category').value=old;renderProblems();renderTerms();renderStep()}function availableUnits(){return DATA.units.filter(u=>u.property===$('property').value).map(u=>u.unit)}function hideUnitSuggestions(){const d=$('unitSuggestions');d.classList.add('hidden');$('unit').setAttribute('aria-expanded','false')}function showUnitSuggestions(){const input=$('unit'),q=input.value.trim().toLowerCase(),list=availableUnits().filter(v=>v.toLowerCase().includes(q));const d=$('unitSuggestions');d.replaceChildren();list.slice(0,70).forEach(v=>{let b=document.createElement('button');b.type='button';b.className='unit-option';b.setAttribute('role','option');b.textContent=v;b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>{input.value=v;hideUnitSuggestions();renderTerms();input.focus()});d.appendChild(b)});d.classList.toggle('hidden',!list.length);input.setAttribute('aria-expanded',String(!!list.length))}function setupUnitSearch(){const i=$('unit');if(i.dataset.ready)return;i.dataset.ready='1';i.addEventListener('input',()=>{i.setCustomValidity('');showUnitSuggestions();renderTerms()});i.addEventListener('focus',showUnitSuggestions);i.addEventListener('keydown',e=>{if(e.key==='Escape')hideUnitSuggestions();if(e.key==='ArrowDown'&&!$('unitSuggestions').classList.contains('hidden')){e.preventDefault();$('unitSuggestions').querySelector('button')?.focus()}});i.addEventListener('blur',()=>setTimeout(hideUnitSuggestions,150));i.addEventListener('change',renderTerms)}function validateUnit(){const i=$('unit');i.setCustomValidity(availableUnits().includes(i.value.trim())?'':(lang==='ar'?'يرجى اختيار وحدة من الاقتراحات':'Please select a valid unit from the suggestions'));return i.reportValidity()}function renderProblems(){let old=$('problem').value,c=DATA.cats.find(c=>c[0]===$('category').value);$('problem').innerHTML='<option value="">'+DATA.t[lang].choose+'</option>'+(c?c[2].map(x=>'<option value="'+x[0]+'">'+text(x[0],x[1])+'</option>').join(''):'');$('problem').value=old}function renderTerms(){let u=DATA.units.find(x=>x.unit===$('unit').value);let commercial=u&&/shop|office|showroom|commercial|store|retail|warehouse/i.test(u.type);let type=commercial?'Commercial':'Residential';$('terms').innerHTML=DATA.terms[type].map((t,i)=>'<p><b>'+(i+1)+'.</b> '+escapeHtml(t[lang]).replace(/\n/g,'<br>')+'</p>').join('')}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderStep(){hideUnitSuggestions();document.querySelectorAll('.step').forEach((x,i)=>x.classList.toggle('hidden',i!==step));document.querySelectorAll('.progress span').forEach((x,i)=>x.classList.toggle('active',i<=step));$('back').classList.toggle('hidden',step===0);$('next').textContent=DATA.t[lang][step===2?'send':'next'];if(step===2){$('summary').textContent=[$('property').value,$('unit').value,$('name').value,'+971'+$('phone').value,$('category').value,$('problem').value,$('description').value].join(' | ');renderTerms()}}function validStep(){if(step===0&&!validateUnit())return false;let controls=[...document.querySelectorAll('.step')][step].querySelectorAll('input:not([type=file]),select,textarea');for(let c of controls){if(!c.reportValidity())return false}return true}async function toBase64(f){return new Promise((resolve,reject)=>{let r=new FileReader;r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(f)})}// The same submission token is reused after an uncertain network result.
  // This prevents accidental duplicate complaints when a tenant retries.
  let pendingSubmissionToken = null;
  function newSubmissionToken(){
    const bytes=new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  }
  function verifyReceipt(token,attempt){
    return new Promise(resolve=>{
      const cb='rakReceipt'+Math.random().toString(36).slice(2);
      const script=document.createElement('script');
      let settled=false;
      const finish=value=>{if(settled)return;settled=true;clearTimeout(timer);delete window[cb];script.remove();resolve(value)};
      const timer=setTimeout(()=>finish(null),9000);
      window[cb]=value=>finish(value&&value.ok?value:null);
      script.onerror=()=>finish(null);
      script.src=API_URL+'?callback='+encodeURIComponent(cb)+'&token='+encodeURIComponent(token)+'&attempt='+attempt;
      document.head.appendChild(script);
    });
  }
  let confirmedReceipt=null;
  function showConfirmedReceipt(receipt){
    confirmedReceipt=receipt;
    const ar=lang==='ar';
    const title=ar?'تم استلام طلب الصيانة بنجاح':'Maintenance Complaint Submitted Successfully';
    const reference=ar?'رقم الشكوى':'Complaint ID';
    const submitted=ar?'تاريخ ووقت الاستلام (الإمارات)':'Submitted At (UAE)';
    const explanation=ar?'تم تسجيل طلبك بنجاح. يرجى الاحتفاظ برقم الطلب للمتابعة.':'Your request has been recorded successfully. Please keep your complaint reference number for follow-up.';
    const responseTitle=ar?'وقت الاستجابة المتوقع':'Expected Response Time';
    const normalMessage=ar
      ?'بالنسبة لطلبات الصيانة العادية غير الطارئة، سيقوم فريقنا بالرد خلال 24 إلى 48 ساعة. قد يستغرق الإصلاح وقتاً أطول حسب طبيعة المشكلة، وتوفر قطع الغيار، وإمكانية الدخول إلى الوحدة، أو الحاجة إلى مقاول خارجي.'
      :'For normal, non-emergency maintenance requests, our team will respond within 24–48 hours. The actual repair may take longer depending on the nature of the issue, availability of spare parts, access to the premises, or the need for an external contractor.';
    const urgentMessage=ar
      ?'تم تسجيل الطلب كطلب عاجل وسيتم مراجعته حسب درجة الخطورة. في حالات الخطر الفوري، يرجى الاتصال بخدمات الطوارئ أو إدارة المبنى مباشرة.'
      :'Your request is marked urgent and will be reviewed according to its severity. For immediate danger, contact emergency services or building management directly.';
    const responseMessage=receipt.priority==='Urgent'?urgentMessage:normalMessage;
    $('form').innerHTML='<section class="receipt-confirmation" role="status" aria-live="polite">'
      +'<div class="receipt-check">✓</div><h2>'+title+'</h2>'
      +'<table class="receipt-table"><tr><th>'+reference+'</th><td>'+escapeHtml(String(receipt.id))+'</td></tr>'
      +'<tr><th>'+submitted+'</th><td>'+escapeHtml(String(receipt.submittedAt))+' (GMT+4)</td></tr></table>'
      +'<p>'+explanation+'</p><div class="receipt-response"><strong>'+responseTitle+'</strong><p>'+responseMessage+'</p></div></section>';
  }
  async function submit(){
    if(!validStep())return;
    const b=$('next');b.disabled=true;b.textContent='...';$('message').textContent='';
    try{
      if(API_URL.startsWith('REPLACE_'))throw Error('Deployment URL not configured');
      const attachments=[];
      for(const f of files)attachments.push({name:f.name,type:f.type,base64:await toBase64(f)});
      if(!pendingSubmissionToken)pendingSubmissionToken=newSubmissionToken();
      const token=pendingSubmissionToken;
      const payload={property:$('property').value,unit:$('unit').value,name:$('name').value,
        phone:'+971'+$('phone').value,email:$('email').value,category:$('category').value,
        problem:$('problem').value,description:$('description').value,priority:$('priority').value,
        language:lang,consent:true,attachments,submissionToken:token};
      // Google Apps Script may save the POST while blocking the cross-origin response.
      // Therefore do not use response.json() or treat 'Failed to fetch' as a failed save.
      try{
        await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
      }catch(networkError){console.warn('POST status unavailable; checking the receipt',networkError)}
      let receipt=null;
      for(let attempt=1;attempt<=6;attempt++){
        await new Promise(r=>setTimeout(r,attempt===1?1200:1800));
        receipt=await verifyReceipt(token,attempt);
        if(receipt)break;
      }
      if(receipt){receipt.priority=payload.priority;showConfirmedReceipt(receipt);return;}
      $('message').textContent=lang==='ar'
        ?'تعذر تأكيد استلام الطلب حالياً. قد يكون قد تم تسجيله. يرجى التواصل مع إدارة المبنى قبل إعادة الإرسال لتجنب التكرار.'
        :'We could not verify your submission yet. It may already be recorded. Please contact the building team before trying again to avoid duplicates.';
      $('message').className='error';
    }catch(e){$('message').textContent=DATA.t[lang].fail+' ('+e.message+')';$('message').className='error'}
    finally{if(document.getElementById('next')){b.disabled=false;renderStep()}}
  }
  $('lang').onclick=()=>{lang=lang==='en'?'ar':'en';if(confirmedReceipt){document.documentElement.lang=lang;document.body.classList.toggle('rtl',lang==='ar');$('lang').textContent=lang==='en'?'العربية':'English';showConfirmedReceipt(confirmedReceipt)}else render()};$('phone').addEventListener('input',e=>{let v=e.target.value.replace(/[^0-9]/g,'');if(v.startsWith('971'))v=v.slice(3);if(v.startsWith('05'))v=v.slice(1);e.target.value=v.slice(0,9)});$('category').onchange=renderProblems;$('unit').onchange=renderTerms;$('back').onclick=()=>{step--;renderStep()};$('next').onclick=()=>{if(step<2){if(!validStep())return;step++;renderStep()}else submit()};$('photos').onchange=e=>{files=[...e.target.files];if(files.length>3||files.some(f=>f.size>3*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type))){alert('Maximum 3 JPG/PNG/WebP photos, each under 3 MB');e.target.value='';files=[]}};const qp=new URLSearchParams(location.search);let selected=qp.get('property');$('property').value=DATA.units.some(u=>u.property===selected)?selected:DATA.units[0].property;render();
  </script>
